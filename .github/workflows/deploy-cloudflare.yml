name: Deploy ShareChat to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sharechat-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run typecheck && npm test -- --run

      - name: Apply idempotent D1 schema
        run: npx wrangler d1 execute sharechat-prod --remote --file=drizzle/0001_sharechat_d1.sql

      - name: Build application
        run: npm run build

      - name: Deploy Worker and custom domain
        run: npx wrangler deploy --config dist/server/wrangler.json --name sharechat --domain sharechat.everanz.com
